<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Title Page</title>
  <!-- Updated Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <!-- Latest Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
</head>
<body>
  <!-- Modern Bulma Navbar -->
  <nav class="navbar" role="navigation" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item" href="#">
        <img src="https://bulma.io/images/bulma-logo.png" alt="Bulma logo">
      </a>
      <a role="button" class="navbar-burger" aria-label="menu" aria-expanded="false" data-target="navbarMenu">
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
        <span aria-hidden="true"></span>
      </a>
    </div>
    <div id="navbarMenu" class="navbar-menu">
      <div class="navbar-start">
        <a class="navbar-item">Home</a>
        <a class="navbar-item">Documentation</a>
        <a class="navbar-item">Blog</a>
      </div>
      <div class="navbar-end">
        <div class="navbar-item">
          <a class="icon is-large" href="#" aria-label="GitHub">
            <i class="fab fa-github"></i>
          </a>
          <a class="icon is-large" href="#" aria-label="Twitter">
            <i class="fab fa-twitter"></i>
          </a>
        </div>
        <div class="navbar-item">
          <div class="buttons">
            <a class="button is-primary">
              <span class="icon"><i class="fab fa-twitter"></i></span>
              <span>Tweet</span>
            </a>
            <a class="button is-light">
              <span class="icon"><i class="fas fa-download"></i></span>
              <span>Download</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="hero is-primary is-bold">
    <div class="hero-body">
      <p class="title">Welcome to My Site</p>
      <p class="subtitle">Fresh, modern, and built with Bulma</p>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="content has-text-centered">
      <p>© 2025 Your Name. Built with Bulma.</p>
    </div>
  </footer>

  <!-- Navbar Burger Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const burger = document.querySelector('.navbar-burger');
      const menu = document.getElementById(burger.dataset.target);
      burger.addEventListener('click', () => {
        burger.classList.toggle('is-active');
        menu.classList.toggle('is-active');
      });
    });
  </script>
</body>
</html>
