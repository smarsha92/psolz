<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixsolz Landing</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <a href="/">
                    <img src="./imgs/newlogo.png" alt="logo">
                </a>
            </div>
            <div class="menu">
                <a href="https://discord.gg/C6WVUsXw" target="_blank" rel="noopener noreferrer">
                    <img src="imgs/Discord-Logo-Black.png" alt="Discord" width="32">
                </a>
                <a href="https://twitter.com/pixsolz" target="_blank" rel="noopener noreferrer">
                    <img src="imgs/Twitter social icons - circle - blue.png" alt="Twitter" width="32">
                </a>
                <a href="https://opensea.io/Pixsolz" target="_blank" rel="noopener noreferrer">
                    <img src="imgs/Logomark-Blue.png" alt="Opensea" width="32">
                </a>
                <a href="https://instagram.com/Pixsouls21" target="_blank" rel="noopener noreferrer">
                    <img src="imgs/Instagram_Glyph_Gradient_RGB.png" alt="IG" width="32">
                </a>
            </div>
        </div>
    </header>

    <section class="container">
        <div class="countdown">
            <h1>Welcome to Pixsolz</h1>
            <p>Discover our digital art collection.</p>
            <div class="btns">
                <a href="index.html" class="hero-btn btn"><span>Enter Site</span></a>
            </div>
        </div>
    </section>

    <footer class="footer-basic">
        <p class="copyright">Pixsolz © 2022</p>
    </footer>

</html>
